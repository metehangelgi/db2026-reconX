# ============================================================================
# TICKET-ADV154 — CI workflow with GHCR push
# TICKET-ADV155 — Liquibase validate step (first step in the backend job,
#                 after Java setup, before `verify`)
# TICKET-ADV156 — JaCoCo coverage gate (>=85% line / >=70% branch) — enforced
#                 by the existing `jacoco-maven-plugin` `check` execution in
#                 backend/pom.xml; `mvn verify` runs it, no separate CI script
#                 needed to parse the report.
# TICKET-ADV157 — Checkstyle — enforced by `maven-checkstyle-plugin` bound to
#                 the `validate` phase in backend/pom.xml, so it runs as part
#                 of every Maven invocation below (including `verify`).
#
# The backend depends on the sibling com.dbtraining.reconx:recon-audit-starter
# module (not published to Maven Central), so it's `mvn install`ed into the
# runner's local repo before any other backend Maven command runs.
# ============================================================================
name: ci

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]

env:
  IMAGE_REGISTRY: ghcr.io
  IMAGE_NAMESPACE: metehangelgi

jobs:

  backend-build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: reconx_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U test"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Install recon-audit-starter (sibling module, not on Central)
        run: ./backend/mvnw -f recon-audit-starter/pom.xml -q -B -DskipTests install

      - name: Liquibase validate
        working-directory: backend
        # `process-resources` first: on a clean checkout target/classes doesn't
        # exist yet, and liquibase-maven-plugin's search path for changeLogFile
        # only includes it (not raw src/main/resources) — invoking the bare
        # `validate` goal on its own fails with ChangeLogParseException: file
        # not found, even though the changelog is fine. Confirmed by
        # reproducing locally with `rm -rf target && ./mvnw liquibase:validate`.
        run: >-
          ./mvnw -B process-resources liquibase:validate
          -Dliquibase.url=jdbc:postgresql://localhost:5432/reconx_test
          -Dliquibase.username=test
          -Dliquibase.password=test

      - name: Build + test (Checkstyle on validate, JaCoCo gate on verify)
        working-directory: backend
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: reconx_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        run: ./mvnw -B verify

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: backend/target/site/jacoco

  frontend-build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Test
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build

  docker-and-push:
    needs: [backend-build-and-test, frontend-build-and-test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata — backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/reconx-backend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=ref,event=tag

      - name: Build + push backend
        uses: docker/build-push-action@v6
        with:
          # Build context is the repo root (not backend/) because the
          # backend image needs the sibling recon-audit-starter module —
          # see backend/Dockerfile's top-of-file comment.
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Metadata — frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/reconx-frontend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=ref,event=tag

      - name: Build + push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
