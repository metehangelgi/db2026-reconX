# =============================================================================
# TICKET-ADV148 — 7-service stack: backend, frontend, postgres, kafka, zookeeper,
#                prometheus, grafana (+ optional kafdrop behind "debug" profile)
# TICKET-ADV152 — Health checks gate dependent services
# =============================================================================
services:

  postgres:
    image: postgres:16-alpine
    container_name: reconx-postgres
    environment:
      POSTGRES_DB:       reconx
      POSTGRES_USER:     reconx_user
      POSTGRES_PASSWORD: reconx_pass
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reconx_user -d reconx"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [reconx]

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: reconx-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME:   2000
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 2181 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [reconx]

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: reconx-kafka
    depends_on:
      zookeeper: {condition: service_healthy}
    ports: ["9092:9092"]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 15s
    networks: [reconx]

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: ghcr.io/metehangelgi/reconx-backend:latest
    container_name: reconx-backend
    depends_on:
      postgres: {condition: service_healthy}
      kafka:    {condition: service_healthy}
    ports: ["8080:8080"]
    environment:
      SPRING_PROFILES_ACTIVE: uat
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB:   reconx
      POSTGRES_USER: reconx_user
      POSTGRES_PASSWORD: reconx_pass
      KAFKA_BOOTSTRAP: kafka:29092
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me-32-bytes-min!!}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/api/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks: [reconx]

  frontend:
    build: ./frontend
    image: ghcr.io/metehangelgi/reconx-frontend:latest
    container_name: reconx-frontend
    depends_on:
      backend: {condition: service_healthy}
    ports: ["5173:80"]
    healthcheck:
      # nginx's `listen 80;` only binds IPv4 — `localhost` resolves ::1 first
      # in this image's /etc/hosts and the check spuriously fails, so probe
      # 127.0.0.1 explicitly.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [reconx]

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: reconx-prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["9090:9090"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [reconx]

  grafana:
    image: grafana/grafana:11.2.0
    container_name: reconx-grafana
    depends_on:
      prometheus: {condition: service_healthy}
    environment:
      GF_SECURITY_ADMIN_USER:     admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP:     "false"
      # TICKET-ADV159 — "Direct link rendered image" needs a renderer. The
      # in-process grafana-image-renderer *plugin* has no linux/arm64 build,
      # so we point at the standalone renderer *service* below instead
      # (bring it up with `--profile debug`). Harmless if that service isn't
      # running — only actual render requests would fail, not Grafana itself.
      GF_RENDERING_SERVER_URL:    http://renderer:8081/render
      GF_RENDERING_CALLBACK_URL:  http://grafana:3000/
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports: ["3000:3000"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks: [reconx]

  # Optional — bring up with `--profile debug`
  kafdrop:
    image: obsidiandynamics/kafdrop:4.0.1
    container_name: reconx-kafdrop
    profiles: ["debug"]
    depends_on:
      kafka: {condition: service_healthy}
    environment:
      KAFKA_BROKERCONNECT: kafka:29092
      JVM_OPTS: "-Xms32M -Xmx64M"
    ports: ["9000:9000"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9000/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [reconx]

  # TICKET-ADV159 — standalone Grafana image-renderer, used for the
  # "Direct link rendered image" screenshots. Optional — bring up with
  # `--profile debug` only when capturing screenshots.
  renderer:
    image: grafana/grafana-image-renderer:latest
    container_name: reconx-renderer
    profiles: ["debug"]
    ports: ["8081:8081"]
    networks: [reconx]

networks:
  reconx:

volumes:
  postgres_data:
  grafana_data:
